# サイト基本設定
title: "Tomoya Nakayama"
locale: "ja-JP"
permalink: /:categories/:title/
url: "https://nakayama-tomoya.github.io"
description: "中山友哉（Tomoya Nakayama）のホームページ。名古屋大学。メダカ等の動物の季節適応・温度適応の分子機構を研究しています。"
google_site_verification: "JLcbNWqy_CTqdMAF0Kt_5NtVUc0MRIIk0WMcZTOfFGM"

plugins:
  - jekyll-include-cache
  - jekyll-sitemap

# テーマの設定（GitHub Pages標準対応形式）
remote_theme: "mmistakes/minimal-mistakes@4.24.0"

# プロフィール欄（左側）の設定
author:
  name: "中山 友哉"
  bio: "メダカをモデルとした動物の季節・温度適応"
  links:
    - label: "researchmap"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://researchmap.jp/nakayama.t"

# 独自のビルド設定を無視するための設定
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  
# デフォルトのページ設定
defaults:
  - scope:
      path: ""
    values:
      layout: "single"
      author_profile: true
